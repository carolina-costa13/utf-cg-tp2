<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paraíso Pokémon - Diorama 3D</title>
    <!-- Importa o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="info">
        <h3>Paraíso Pokémon (Trabalho Prático)</h3>
        <p>Pressione <b>1</b> ou <b>2</b> para trocar de câmera.</p>
        <p>Pressione <b>P</b> para mudar a pose do personagem.</p>
        <p>Pressione <b>L</b> para ligar/desligar a luz.</p>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Importa a biblioteca TWGL.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twgl.js/5.5.0/twgl-full.min.js"></script>
    
    <script type="module" src="main.js"></script>
</body>
</html>
